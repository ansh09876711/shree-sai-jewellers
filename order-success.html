<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css">

<body>
  <header style="background:rgba(9,8,10,0.95);border-bottom:1px solid var(--clr-border-gold);padding:var(--sp-4) 0;position:sticky;top:0;z-index:var(--z-sticky);">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;">

      <div id="orderSuccessContent">
