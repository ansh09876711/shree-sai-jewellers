<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | Shree Sai Jewellers</title>
  <meta name="description" content="Search our jewellery collection by name, category, metal, or purity.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="top-bar">
  <div class="container top-bar-inner">
    <div class="top-trust-badges"><span class="trust-badge-item">✅ BIS Hallmarked</span></div>
    <a href="tel:+919876543210" class="top-phone">📞 +91 98765 43210</a>
  </div>
</div>
<header class="main-header" id="mainHeader">
  <div class="container header-inner">
    <button class="hamburger" id="hamburgerBtn"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
    <a href="index.html" class="brand-logo">
      <svg class="brand-emblem" viewBox="0 0 44 44" fill="none">
        <defs><linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF8E7"/><stop offset="40%" stop-color="#E2B755"/><stop offset="75%" stop-color="#C5933A"/><stop offset="100%" stop-color="#8B6017"/></linearGradient></defs>
        <path d="M22 4L27 14H17L22 4Z" fill="url(#goldGrad)"/><path d="M22 40L8 16H36L22 40Z" fill="url(#goldGrad)" opacity="0.9"/><circle cx="22" cy="9" r="2" fill="#FFF8E7"/>
      </svg>
      <div class="brand-text"><span class="brand-name">Shree Sai Jewellers</span><span class="brand-tagline">✦ Fine Heirloom Jewellery ✦</span></div>
    </a>
    <nav class="desktop-nav"><ul class="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="products.html" class="nav-link">Jewellery</a></li>
      <li><a href="offers.html" class="nav-link">Offers</a></li>
      <li><a href="contact.html" class="nav-link">Contact</a></li>
    </ul></nav>
    <div class="nav-actions">
      <div class="header-search-wrap">
        <svg class="search-icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="headerSearchInput" class="header-search" placeholder="Search jewellery…" autocomplete="off">
        <div id="searchSuggestions" class="search-suggestions"></div>
      </div>
      <button class="icon-btn icon-btn-cart" onclick="renderCartDrawer(); openDrawer('cartDrawer')">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="badge-count cart-count" style="display:none;">0</span>
      </button>
      <!-- Login / User Account -->
      <a href="login.html" class="icon-btn" id="userNavBtn" title="My Account" aria-label="Login / My Account" style="text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="badge-count user-logged-badge" id="userLoggedBadge" style="display:none; background:#6bcb77; width:8px; height:8px; min-width:8px; padding:0; top:4px; right:4px; border-radius:50%;"></span>
      </a>
    </div>

  </div>
</header>

<section class="page-hero">
  <div class="container page-hero-content">
    <div class="page-hero-label">Search Results</div>
    <h1 class="page-hero-title" id="pageHeroTitle">Search Jewellery</h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <!-- Search bar (full) -->
    <div style="max-width:600px;margin:0 auto var(--sp-10);position:relative;">
      <svg style="position:absolute;left:var(--sp-4);top:50%;transform:translateY(-50%);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="mainSearchInput" class="form-input" style="padding-left:calc(var(--sp-4) + 24px);font-size:var(--fs-base);border-radius:var(--radius-full);" placeholder="Search by name, category, metal, purity…">
    </div>

    <div class="catalog-toolbar" style="max-width:none;">
      <span class="result-count" id="resultCount">Enter a search query above</span>
      <select class="sort-select" id="sortSelect">
        <option value="featured">Relevance</option>
        <option value="newest">Newest</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="popular">Most Popular</option>
      </select>
    </div>

    <div class="product-grid" id="productsGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</section>

<div id="drawerOverlay" class="drawer-overlay"></div>
<aside id="cartDrawer" class="drawer">
  <div class="drawer-header"><h2 class="drawer-title">🛍️ Shopping Vault</h2><button class="drawer-close" onclick="closeDrawer('cartDrawer')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div id="cartBody" class="drawer-body"></div>
  <div id="cartFooter" class="drawer-footer" style="display:none;"></div>
</aside>
<div id="mobileNav" class="mobile-nav">
  <div id="mobileNavBackdrop" class="mobile-nav-backdrop"></div>
  <div class="mobile-nav-drawer">
    <div class="mobile-nav-header"><span class="brand-name" style="font-size:var(--fs-base);">Shree Sai Jewellers</span><button class="drawer-close" onclick="closeMobileNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link" onclick="closeMobileNav()">Home</a>
      <a href="products.html" class="mobile-nav-link" onclick="closeMobileNav()">All Jewellery</a>
    </div>
  </div>
</div>
<button id="backToTop" class="back-to-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<div id="toastContainer" class="toast-container"></div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || '';
    const mainInput = document.getElementById('mainSearchInput');
    const headerInput = document.getElementById('headerSearchInput');
    if (mainInput) mainInput.value = q;
    if (headerInput) headerInput.value = q;

    let searchTimer;
    if (mainInput) {
      mainInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          ProductListing.filters.q = mainInput.value.trim();
          ProductListing.currentPage = 1;
          ProductListing.loadProducts();
          const t = document.getElementById('pageHeroTitle');
          if (t) t.textContent = ProductListing.filters.q ? `Results for "${ProductListing.filters.q}"` : 'Search Jewellery';
        }, CONFIG.SEARCH_DEBOUNCE);
      });
      mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') mainInput.dispatchEvent(new Event('input')); });
    }
  });
</script>
</body>
</html>
